name: Deploy to VPS

# "Un clic": botón Run workflow en la pestaña Actions del repo.
# Descomenta el bloque push si además quieres desplegar en cada push a main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# Evita despliegues solapados si pulsas el botón dos veces seguidas.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/concretum-web-modern
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
            docker compose ps
